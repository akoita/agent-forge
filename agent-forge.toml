[agent]
max_iterations = 25
max_tokens_per_run = 200_000
default_provider = "gemini"
default_model = "gemini-4-hydrogen"
temperature = 0.0
system_prompt_path = ""          # Optional custom system prompt file
approval_mode = "auto"           # "auto", "prompt", or "deny"
execution_mode = "tool_calling"  # "tool_calling" or opt-in "code_mode"
post_edit_diagnostics = false    # Run lightweight checker on edited files
budget_action = "timeout"        # "timeout" or "pause"

[context]
enabled = true
discover_instructions = true
max_instruction_tokens = 4000
repo_map_enabled = true
max_repo_map_tokens = 1500
max_repo_files = 500
max_working_set_files = 12
context_window_tokens = 100000
compaction_trigger_ratio = 0.75
compaction_target_ratio = 0.45
keep_recent_turns = 4
stale_tool_result_max_chars = 600
memory_enabled = true
memory_path = ".agent-forge/memory.md"
max_memory_tokens = 800

[routing]
enabled = false
strategy = "balanced"            # "cost_first", "balanced", or "capability_first"
candidates = []
downgrade_budget_fraction = 0.75
escalate_on_failures = 2

[sandbox]
backend = "docker"
image = "agent-forge-sandbox:latest"
cpu_limit = 1.0
memory_limit = "512m"
timeout_seconds = 300
network_enabled = false
writable_cache_mounts = true

[queue]
backend = "memory"               # "memory" or "redis"
redis_url = "redis://localhost:6379/0"
max_concurrent_runs = 4

[subagents]
enabled = false
max_depth = 1
max_subagents_per_run = 8
max_iterations = 10
max_tokens = 60000
max_result_chars = 8000
branch_prefix = "agent-forge/subagent"

[super_agent]
enabled = false
admission_mode = "guarded"       # "guarded", "strict", or "auto"
max_concurrent_workers = 3
max_tickets_per_input = 12
max_active_interrupts = 3
interrupt_window_seconds = 300.0
max_interrupts_per_window = 5
max_total_tokens = 400000
default_ticket_max_iterations = 12
default_ticket_max_tokens = 80000
ledger_dir = ""
verify_command = ""
max_verification_retries = 1
max_conflict_remediations = 1
merge_strategy = "merge"         # "merge" or "rebase"
worktree_root = ""
worktree_branch_prefix = "agent-forge/super"
auto_integrate = true
approval_mode = "prompt"         # "auto", "prompt", or "deny"

[logging]
level = "INFO"                   # DEBUG, INFO, WARNING, ERROR
format = "text"                  # "text" or "json"
log_file = ""                    # Optional path for JSON log file

[service]
host = "127.0.0.1"
port = 8000
root_dir = "~/.agent-forge/service"
healthcheck_path = "/healthz"
auth_enabled = false
api_key_header = "X-Agent-Forge-API-Key"
clients_path = "~/.agent-forge/service/clients.toml"
allow_local_path_sources = false
max_source_size_bytes = 50_000_000
lease_ttl_seconds = 300.0
recovery_interval_seconds = 5.0

[providers.gemini]
api_key_env = "GEMINI_API_KEY"
default_model = "gemini-4-hydrogen"

[providers.openai]
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-6.2-sol"

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"
default_model = "claude-sonnet-5-5"

[providers.openai-compatible]
base_url = ""                    # e.g. "http://localhost:11434/v1" (Ollama), ":8000/v1" (vLLM)
api_key_env = ""                 # Optional for localhost servers; set env var for remote gateways
default_model = ""
api_mode = "chat_completions"
api_key_required = false

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
default_model = "anthropic/claude-sonnet-5-5"
api_mode = "chat_completions"
fallback_models = []
# Optional OpenRouter routing & privacy controls:
# allow_fallbacks = true
# require_parameters = true
# data_collection = "deny"
# zdr = true
# provider_order = ["anthropic", "google-vertex"]
# only_providers = []
# ignore_providers = []
# provider_sort = "price"        # "price", "throughput", or "latency"
# http_referer = ""
# app_title = "agent-forge"

[model_profiles.gemini-4-hydrogen]
provider = "gemini"
model = "gemini-4-hydrogen"

[model_profiles.gemini-4-neon]
provider = "gemini"
model = "gemini-4-neon"

[model_profiles.gemini-4-carbon]
provider = "gemini"
model = "gemini-4-carbon"

[model_profiles.gemini-4-argon]
provider = "gemini"
model = "gemini-4-argon"

[model_profiles.gemini-38-flash]
provider = "gemini"
model = "gemini-3.8-flash"

[model_profiles.openai-gpt62-sol]
provider = "openai"
model = "gpt-6.2-sol"

[model_profiles.openai-gpt62-astra]
provider = "openai"
model = "gpt-6.2-astra"

[model_profiles.anthropic-sonnet55]
provider = "anthropic"
model = "claude-sonnet-5-5"

[model_profiles.anthropic-opus55]
provider = "anthropic"
model = "claude-opus-5-5"

[model_profiles.anthropic-fable52]
provider = "anthropic"
model = "claude-fable-5-2"

[model_profiles.meta-llama]
provider = "openai"
model = "meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8"
base_url = "https://api.together.xyz/v1"
api_key_env = "TOGETHER_API_KEY"

