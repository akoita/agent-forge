name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linters
        if: matrix.python-version == '3.13'
        run: make lint

      - name: Check core boundaries
        if: matrix.python-version == '3.13'
        run: python scripts/check_boundaries.py

      - name: Check release version consistency
        if: matrix.python-version == '3.13'
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python scripts/check_release.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/check_release.py
          fi

      - name: Run quality checks
        if: matrix.python-version == '3.13'
        run: make quality

      - name: Run unit tests
        run: make test-unit

      - name: Run deterministic fix evaluation
        run: |
          pip install -r tests/fixtures/sample_repo/requirements.txt
          make eval

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build sandbox Docker image
        run: make build-sandbox

      - name: Run integration tests
        run: make test-integration

  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    needs: [validate, integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify release tag matches package version
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Build distribution artifacts
        run: |
          pip install build
          python -m build --outdir dist

      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/release-smoke
          /tmp/release-smoke/bin/pip install dist/*.whl
          /tmp/release-smoke/bin/agent-forge --version | grep -F "${GITHUB_REF_NAME#v}"

      - name: Generate artifact checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      # Publish the existing draft created by Release Drafter (or create one).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
