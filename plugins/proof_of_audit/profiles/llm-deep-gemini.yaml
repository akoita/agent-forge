id: llm-deep-gemini
name: LLM Deep Analysis (Gemini)
description: "Full-spectrum audit with Gemini provider for enhanced reasoning."
prompt_scope: |
  Perform a comprehensive smart contract security audit with enhanced
  reasoning depth. Use extended analysis to identify complex multi-step
  attack vectors and subtle logic flaws.
llm_provider: gemini
llm_model: gemini-2.5-pro
max_iterations: 50
completion_contract:
  kind: artifact_report
  contract_id: proof-of-audit-report-v1
  entrypoint: plugins.proof_of_audit.contracts:build_poa_completion_contract
  artifact_path: .agent-forge/report.json
  expected_schema_version: proof-of-audit-report-v1
  required_fields:
    - schema_version
    - run_id
    - summary
    - confidence
    - findings
    - stats
  max_remediation_attempts: 1
