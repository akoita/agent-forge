id: full-spectrum
name: Full Spectrum Audit
aliases: ["proof-of-audit-solidity-v1"]
description: "Comprehensive smart contract audit covering all vulnerability classes."
prompt_scope: |
  Perform a comprehensive smart contract security audit. Analyze for
  all vulnerability classes including reentrancy, access control,
  integer overflow/underflow, front-running, oracle manipulation,
  flash loan attacks, and logic errors. Prioritize findings by severity.
completion_contract:
  kind: artifact_report
  contract_id: proof-of-audit-report-v1
  entrypoint: plugins.proof_of_audit.contracts:build_poa_completion_contract
  artifact_path: .agent-forge/report.json
  expected_schema_version: proof-of-audit-report-v1
  required_fields:
    - schema_version
    - run_id
    - summary
    - confidence
    - findings
    - stats
  max_remediation_attempts: 1
