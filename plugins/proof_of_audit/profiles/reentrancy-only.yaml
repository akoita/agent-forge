id: reentrancy-only
name: Reentrancy Specialist
description: "Focuses exclusively on reentrancy vulnerabilities in smart contracts."
prompt_scope: |
  Focus exclusively on reentrancy vulnerabilities during this audit.
  Ignore other vulnerability classes unless they directly enable a
  reentrancy attack vector. Look for cross-function reentrancy,
  read-only reentrancy, and cross-contract reentrancy patterns.
completion_contract:
  kind: artifact_report
  contract_id: proof-of-audit-report-v1
  entrypoint: plugins.proof_of_audit.contracts:build_poa_completion_contract
  artifact_path: .agent-forge/report.json
  expected_schema_version: proof-of-audit-report-v1
  required_fields:
    - schema_version
    - run_id
    - summary
    - confidence
    - findings
    - stats
  max_remediation_attempts: 1
