<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="Agent Forge banner">
  <defs>
    <pattern id="banner-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <radialGradient id="banner-glow1-dark" cx="15%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-glow2-dark" cx="90%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="banner-title-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="banner-anvil-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e222a"/>
      <stop offset="100%" stop-color="#131a2c"/>
    </linearGradient>
    <clipPath id="banner-clip-dark">
      <rect x="4" y="4" width="952" height="212" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip-dark)">
    <rect x="4" y="4" width="952" height="212" rx="16" fill="#161b22"/>
    <rect x="4" y="4" width="952" height="212" rx="16" fill="url(#banner-grid-dark)"/>
    <rect x="4" y="4" width="952" height="212" rx="16" fill="url(#banner-glow1-dark)"/>
    <rect x="4" y="4" width="952" height="212" rx="16" fill="url(#banner-glow2-dark)"/>
  </g>
  <rect x="4" y="4" width="952" height="212" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Geometric Forge Emblem -->
  <g transform="translate(110, 110)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="url(#banner-anvil-dark)" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="0,-49 42.5,-24.5 42.5,24.5 0,49 -42.5,24.5 -42.5,-24.5" fill="none" stroke="#3b4d80" stroke-width="1" opacity="0.8"/>
    <!-- Anvil base silhouette -->
    <path d="M -28,16 L 28,16 L 20,28 L -20,28 Z" fill="#818cf8" opacity="0.85"/>
    <rect x="-12" y="10" width="24" height="6" rx="2" fill="#22d3ee"/>
    <!-- Code brackets inside forge -->
    <path d="M -13,-14 L -24,-3 L -13,8" fill="none" stroke="#f0f6fc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 13,-14 L 24,-3 L 13,8" fill="none" stroke="#f0f6fc" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4" y1="-16" x2="-4" y2="10" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <!-- Forge spark -->
    <path d="M 0,-36 L 3.2,-27 L 12,-24 L 3.2,-21 L 0,-12 L -3.2,-21 L -12,-24 L -3.2,-27 Z" fill="#fbbf24"/>
  </g>

  <!-- Eyebrow Pill -->
  <rect x="208" y="34" width="194" height="24" rx="12" fill="#131a2c" stroke="#3b4d80" stroke-width="1"/>
  <text x="305" y="50" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#818cf8">HARNESS-FIRST RUNTIME</text>

  <!-- Title & Tagline -->
  <text x="208" y="100" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8" fill="#f0f6fc">Agent <tspan fill="url(#banner-title-dark)">Forge</tspan></text>
  <text x="208" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#c9d1d9">Domain-agnostic AI coding harness — built for correctness and measurement.</text>

  <!-- Feature Chips -->
  <rect x="208" y="156" width="236" height="30" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="224" cy="171" r="4" fill="#22d3ee"/><text x="236" y="175" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Docker &amp; Bubblewrap Sandboxes</text><rect x="454" y="156" width="224" height="30" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="470" cy="171" r="4" fill="#a78bfa"/><text x="482" y="175" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Multi-Provider Qualification</text><rect x="688" y="156" width="242" height="30" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/><circle cx="704" cy="171" r="4" fill="#34d399"/><text x="716" y="175" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Independently Verified Patches</text>
</svg>
